# Configuración de Análisis Estático SonarQube para Cuidarte+ (ISY1102)
sonar.projectKey=cuidarte-plus
sonar.projectName=Cuidarte+ - Sistema de Exámenes Médicos
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.inclusions=backend/src/**,frontend/src/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/uploads/**,**/dist/**,**/build/**

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Cobertura de pruebas unitarias generada por Jest (LCOV)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Reglas y Calidad de Código
sonar.qualitygate.wait=false
