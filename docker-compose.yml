version: '3.8'

services:
  # Base de Datos Relacional PostgreSQL (Sección 4.2 y Restricciones ERS)
  postgres_db:
    image: postgres:15-alpine
    container_name: cuidarte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuidarte_admin
      POSTGRES_PASSWORD: CuidarteDB2026_Secure!
      POSTGRES_DB: cuidarte_plus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuidarte_admin -d cuidarte_plus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor SonarQube para Análisis Estático de Código Fuente (ISY1102 / SAST)
  sonarqube:
    image: sonarqube:lts-community
    container_name: cuidarte_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  # Backend RESTful Express Node.js (Sección 4.2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuidarte_backend
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: cuidarte_admin
      DB_PASSWORD: CuidarteDB2026_Secure!
      DB_NAME: cuidarte_plus
      JWT_SECRET: cuidarte_plus_jwt_secure_key_2026_super_secret
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend SPA React (Sección 4.1)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cuidarte_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
